project:
  type: website
  output-dir: docs
  # Built interactive demos (make demos), copied into docs/ on render.
  resources:
    - demos/dist/
  render:
    # Order is set by the sidebar below, not by these globs. One level deep per
    # unit; plan/ holds internal working docs and is excluded from the site.
    - "*.qmd"
    - "*.md"
    - "*/*.qmd"
    - "*/*.md"
    - "!plan/"
    - "!unused-figures/"
    - "!tools/"
    - "!edit-notes/"
    - "!node_modules/"
    - "!demos/"
    # Teacher-only pages: kept in the repo (read them on GitHub), not published.
    - "!README.md"
    - "!audience.md"
    - "!contentplan.md"
    - "!designprinciples.md"
    - "!authors.md"
    - "!CODE_AUDIT_CHECKLIST.md"

website:
  title: "Numerical analysis for biologists"
  navbar:
    left:
      - href: index.qmd
        text: Home
  sidebar:
    style: docked
    search: true
    contents:
      - text: Home
        href: index.qmd
      - section: "Course info"
        contents:
          - text: Install R (and Python or Rust)
            href: intro/install.qmd
          - text: Glossary
            href: dictionary.qmd
      # ----------------------------------------------------------------------
      # Order is defined HERE, not in filenames. To reorder a unit, move its
      # block; never rename its folder. The agreed order is in contentplan.md.
      # styles.css colours leaf links by filename: *lec* → green,
      # *quiz* → blue, #explore demos → orange; and gives each top-level
      # section ("Part N: ...") its own colour stripe.
      #
      # Template for a unit (copy, then fill in):
      # - section: "Part 1: Numbers on a computer"
      #   contents:
      #     - section: "Floating point"
      #       contents:
      #         - text: "Lecture (slides)"
      #           href: floating-point/lec.qmd
      #         - text: "Quiz"
      #           href: floating-point/quiz.qmd
      #         - text: "Exercise"
      #           href: floating-point/exercise.qmd
      #         - text: "Demo: ..."
      #           href: floating-point/exercise.qmd#explore
      # ----------------------------------------------------------------------
      # BEGIN UNITS (generated by plan/sidebar.py — do not edit by hand)
      - section: "Part 1: Numbers on a computer"
        contents:
          - section: "Why numerical analysis?"
            contents:
              - text: "Lecture (slides)"
                href: intro/lec.qmd
              - text: "Quiz"
                href: intro/quiz.qmd
              - text: "Exercise"
                href: intro/exercise.qmd
              - text: "Demo: Taylor error and order"
                href: intro/exercise.qmd#explore
          - section: "How computers store numbers"
            contents:
              - text: "Lecture (slides)"
                href: floating-point/lec.qmd
              - text: "Quiz"
                href: floating-point/quiz.qmd
              - text: "Exercise"
                href: floating-point/exercise.qmd
              - text: "Demo: inspect a double"
                href: floating-point/exercise.qmd#explore
          - section: "Error, conditioning and stability"
            contents:
              - text: "Lecture (slides)"
                href: error-conditioning/lec.qmd
              - text: "Quiz"
                href: error-conditioning/quiz.qmd
              - text: "Exercise"
                href: error-conditioning/exercise.qmd
              - text: "Demo: one-pass vs two-pass variance"
                href: error-conditioning/exercise.qmd#explore
          - section: "Convergence and cost"
            contents:
              - text: "Lecture (slides)"
                href: convergence-cost/lec.qmd
              - text: "Quiz"
                href: convergence-cost/quiz.qmd
              - text: "Exercise"
                href: convergence-cost/exercise.qmd
              - text: "Demo: choose the step size"
                href: convergence-cost/exercise.qmd#explore
      - section: "Part 2: Solving nonlinear equations"
        contents:
          - section: "Bisection and fixed-point iteration"
            contents:
              - text: "Lecture (slides)"
                href: bisection-fixedpoint/lec.qmd
              - text: "Quiz"
                href: bisection-fixedpoint/quiz.qmd
              - text: "Exercise"
                href: bisection-fixedpoint/exercise.qmd
          - section: "Newton and secant methods"
            contents:
              - text: "Lecture (slides)"
                href: newton/lec.qmd
              - text: "Quiz"
                href: newton/quiz.qmd
              - text: "Exercise"
                href: newton/exercise.qmd
          - section: "Newton for systems of equations"
            contents:
              - text: "Lecture (slides)"
                href: newton-systems/lec.qmd
              - text: "Quiz"
                href: newton-systems/quiz.qmd
              - text: "Exercise"
                href: newton-systems/exercise.qmd
      - section: "Part 3: Linear systems"
        contents:
          - section: "Gaussian elimination as LU"
            contents:
              - text: "Lecture (slides)"
                href: lu/lec.qmd
              - text: "Quiz"
                href: lu/quiz.qmd
              - text: "Exercise"
                href: lu/exercise.qmd
          - section: "Pivoting, norms and conditioning"
            contents:
              - text: "Lecture (slides)"
                href: pivoting-conditioning/lec.qmd
              - text: "Quiz"
                href: pivoting-conditioning/quiz.qmd
              - text: "Exercise"
